{% extends "base.html" %}

{% block title %}Login | Staff Document Portal{% endblock %}

{% block content %}
<section class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">SD</div>

        <h2>Staff Sign In</h2>
        <p class="muted">
            Sign in to access the internal document library.
        </p>

        <form method="POST" class="login-form">
            <label for="username">Staff Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <button type="submit">Sign In</button>
        </form>

        <div class="demo-note">
            <strong>Demo Environment</strong>
            <p>
                This portal is a controlled security demonstration.
                No real staff credentials are used.
            </p>
        </div>
    </div>
</section>
{% endblock %}
