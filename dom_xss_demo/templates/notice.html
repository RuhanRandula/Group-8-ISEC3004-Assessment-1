<!-- CurtiBoard — Individual Notice Detail Page                            -->
<!-- ISEC3004 Assignment 1 — Member 1 — VULNERABLE VERSION                -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ notice.title }} — CurtiBoard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="/board" class="brand">📋 CurtiBoard</a>
        <span class="tagline">University Notice Board</span>
        <span class="mode-badge vulnerable">⚠️ VULNERABLE MODE</span>
    </div>
</header>

<main class="container">
    <a href="/board" class="back-link">← Back to all notices</a>
    <article class="notice-detail">
        <span class="category-badge cat-{{ notice.category|lower }}">
            {{ notice.category }}
        </span>
        <h1>{{ notice.title }}</h1>
        <p>{{ notice.body }}</p>
    </article>
</main>

<footer class="site-footer">
    CurtiBoard — ISEC3004 Assignment 1 DOM XSS Demo — Local Use Only
</footer>

</body>
</html>
